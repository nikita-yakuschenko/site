name: Проверка избранного
on:
  pull_request:
    paths: ['src/**', 'e2e/**', 'package*.json', 'playwright.preferences.config.ts', '.github/workflows/project-preferences.yml']
  push:
    branches: [main]
    paths: ['src/**', 'e2e/**', 'package*.json', 'playwright.preferences.config.ts', '.github/workflows/project-preferences.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run test:e2e:preferences
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preferences-browser-traces
          path: test-results/
          retention-days: 7

name: Выпуск CMS
run-name: "Выпуск CMS №${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - 'src/lib/**'
      - 'src/data/webp-assets.json'
      - '.github/workflows/cms-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A later push waits. Canceling would leave a migration and a deploy half-finished.
concurrency:
  group: cms-release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Проверка кода и базы данных
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - name: Установить зависимости CMS
        working-directory: cms
        run: npm ci --no-audit --no-fund
      - name: Установить общие зависимости сайта и CMS
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund zod
      - name: Проверить типы TypeScript
        working-directory: cms
        run: npx tsc --noEmit -p .
      - name: Запустить тесты и проверить правила миграций
        working-directory: cms
        run: npm test
      - name: Применить миграции к пустой базе данных
        working-directory: cms
        env:
          DATABASE_URL: postgresql://cms:cms@localhost:5432/cms
          PAYLOAD_SECRET: ci-payload-secret-is-at-least-32-chars
          CMS_PUBLIC_URL: https://cms.example.test
          CMS_SEED: '0'
          PAYLOAD_DB_PUSH: 'false'
          NODE_ENV: production
        run: node node_modules/tsx/dist/cli.mjs scripts/migrate-runner.ts
      - name: Проверить соответствие схемы базы данных Payload
        working-directory: cms
        env:
          DATABASE_URL: postgresql://cms:cms@localhost:5432/cms
          PAYLOAD_SECRET: ci-payload-secret-is-at-least-32-chars
          CMS_PUBLIC_URL: http://127.0.0.1:3001
          CMS_SEED: '0'
          PAYLOAD_DB_PUSH: 'false'
          NODE_ENV: development
        run: node node_modules/tsx/dist/cli.mjs scripts/check-schema-drift.ts

      - name: Проверить обработку регистраций, писем и DMP
        working-directory: cms
        env:
          DATABASE_URL: postgresql://cms:cms@localhost:5432/cms
          PAYLOAD_SECRET: ci-payload-secret-is-at-least-32-chars
          CMS_PUBLIC_URL: http://127.0.0.1:3001
          CMS_MAINTENANCE: '1'
          CMS_AUTOMATION_TEST_DATABASE: 'true'
        run: npx tsx --test --test-force-exit tests/integration/automation.test.ts

      - name: Проверить полное дублирование проектов и атомарность цен
        working-directory: cms
        env:
          DATABASE_URL: postgresql://cms:cms@localhost:5432/cms
          PAYLOAD_SECRET: ci-payload-secret-is-at-least-32-chars
          CMS_PUBLIC_URL: http://127.0.0.1:3001
          CMS_MAINTENANCE: '1'
          CMS_PROJECT_COPY_TEST_DATABASE: 'true'
        run: npx tsx --test --test-force-exit tests/integration/project-copy.test.ts

  publish:
    name: Сборка и публикация образа CMS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      revision: ${{ github.sha }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cms
            src/lib
            src/data/webp-assets.json
          fetch-depth: 1
      - name: Подготовить сборщик Docker
        uses: docker/setup-buildx-action@v3
      - name: Подключиться к хранилищу образов GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Собрать и загрузить образ CMS
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cms/Dockerfile
          target: release
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            CMS_REVISION=${{ github.sha }}
          tags: ghcr.io/nikita-yakuschenko/avgst-cms:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nikita-yakuschenko/site
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=avgst-cms
          cache-to: type=gha,scope=avgst-cms,mode=max
      - name: Записать результат публикации образа
        run: |
          echo "### Образ CMS" >> "$GITHUB_STEP_SUMMARY"
          echo 'ghcr.io/nikita-yakuschenko/avgst-cms@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Рабочая CMS обновляется только при включённом CMS_RELEASE_ENABLED и установленном серверном скрипте выпуска.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Обновление рабочей CMS
    needs: publish
    if: vars.CMS_RELEASE_ENABLED == 'true' && github.repository == 'nikita-yakuschenko/site' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, avgst-cms]
    timeout-minutes: 30
    environment: cms-production
    permissions:
      contents: none
    steps:
      - name: Выпустить обновление через защищённый серверный скрипт
        env:
          IMAGE: ghcr.io/nikita-yakuschenko/avgst-cms@${{ needs.publish.outputs.digest }}
          REVISION: ${{ needs.publish.outputs.revision }}
        run: sudo -- /usr/local/sbin/avgst-cms-release "$IMAGE" "$REVISION"

name: CMS image

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - '.github/workflows/cms-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cms-image-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cms
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CMS
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          file: ./cms/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nikita-yakuschenko/avgst-cms:latest
            ghcr.io/nikita-yakuschenko/avgst-cms:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nikita-yakuschenko/site
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=avgst-cms
          cache-to: type=gha,scope=avgst-cms,mode=max
      - name: Published image
        env:
          REVISION: ${{ github.sha }}
        run: |
          echo "### CMS image published" >> "$GITHUB_STEP_SUMMARY"
          echo 'Dokploy image: `ghcr.io/nikita-yakuschenko/avgst-cms:latest`' >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable image: ghcr.io/nikita-yakuschenko/avgst-cms:sha-${REVISION}" >> "$GITHUB_STEP_SUMMARY"

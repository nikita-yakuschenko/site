name: Выпуск сайта
run-name: "Выпуск сайта №${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/**'
      - 'docs/cookie-policy-final.md'
      - 'docs/politika_obrabotki_personalnyh_dannyh_final.md'
      - 'Dockerfile'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: site-release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Сборка и публикация сайта
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_COMMIT=${{ github.sha }}
          tags: ghcr.io/nikita-yakuschenko/avgst-site:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nikita-yakuschenko/site
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=avgst-site
          cache-to: type=gha,scope=avgst-site,mode=max

  release:
    name: Обновление рабочего сайта
    needs: publish
    if: vars.SITE_RELEASE_ENABLED == 'true' && github.repository == 'nikita-yakuschenko/site' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, avgst-cms]
    timeout-minutes: 30
    environment: site-production
    permissions:
      contents: none
      packages: none
    steps:
      - name: Выпустить проверенный образ через Dokploy
        env:
          IMAGE: ghcr.io/nikita-yakuschenko/avgst-site@${{ needs.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: sudo -- /usr/local/sbin/avgst-site-release "$IMAGE" "$REVISION"
